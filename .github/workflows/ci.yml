name: CI

# Documentation carries no build or test signal, so a change confined to it
# skips CI entirely. `paths-ignore` rather than `paths` so that anything new
# and unlisted still gets built — the safe direction to be wrong in.
#
# This must be dropped if `build` ever becomes a required status check: a
# skipped job reports nothing, and branch protection waits for it forever.
on:
  push:
    branches:
      - main
    paths-ignore: &docs
      - "**/*.md"
      - "**/*.txt"
      - LICENSE
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

# Superseded runs are cancelled on `main` too, not just on pull requests, since
# that is where this repository is actually pushed. The cost is that a commit
# pushed over quickly keeps no CI verdict of its own — acceptable while only the
# tip is released from, but it does make a later bisect less informative.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7

      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@v6

      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        run: rustup show

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: lint
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: test
        run: |
          cargo test
          node --run typecheck
          node --run build
          node --run test:e2e
